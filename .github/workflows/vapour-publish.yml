# Publishes to Vapour when you push a tag like v0.1.0.
# Needs: the VAPOUR_TOKEN repository secret, and a released vapour-computer/vapour-ci (the @v1 tag).
# This is templates/godot-publish.yml from vapour-computer/vapour-ci.
name: vapour-publish
on:
  push:
    tags: ["v*"]
env:
  GODOT_VERSION: "4.7.2"
jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2   # keep in sync with GODOT_VERSION
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Export for web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - name: Resolve publish version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: vapour-computer/vapour-ci@v1
        with:
          token: ${{ secrets.VAPOUR_TOKEN }}
          version: ${{ steps.version.outputs.value }}
          notes: "Release ${{ github.ref_name }}"
